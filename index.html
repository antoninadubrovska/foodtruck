<!DOCTYPE html>
<html lang="sv">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Foodtruck</title>
	<link rel="stylesheet" href="./style/base.css">
	<link rel="stylesheet" href="./style/styles.css">

	<script type="module" src="./src/main.js"></script>
</head>
<body>
<main>

	<div class="menu-container">

		<div class="cart-icon">

			<img src="./assets/cart.svg" alt="cart">
			<span class="cart-count">0</span>
		</div>
		<div class="menu-items-container">
		</div>
	</div>


	<section id="cart-page" class="hidden">
		<div id="cart-items"></div>
		<p>Total: <span id="cart-total">0 SEK</span></p>
		<button id="checkout-btn" class="checkout-or-goback-group">Checkout</button>
	</section>
	<!-- <section id="eta-container" >
		<img src="./assets/boxtop.svg" alt="boxtop">
	</section> -->


	<section id="receipt-page" >

		<h2>Kvitto</h2>
		<p>
		  #<strong id="receipt-order-id"></strong><br>
		  ETA: <strong id="receipt-eta"></strong>
		</p>

		<div id="receipt-items"></div>

		<div class="cart-total">
		  <strong id="receipt-total">0 SEK</strong>
		</div>

		<button id="new-order-btn">GÖR EN NY BESTÄLLNING</button>
	  </section>

</main>

</body>
</html>
